[package]
name = "melee-model-extractor"
version = "0.1.0"
edition = "2021"
description = "Extract 3D character models from Melee ISO for web rendering"

[dependencies]
dat_extractor = { git = "https://github.com/AlexanderHarrison/dat_extractor.git" }
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
