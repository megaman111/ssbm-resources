<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melee Calculator - Melee Resources Hub</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .back-link { display: inline-block; margin-top: 1rem; color: #667eea; text-decoration: none; font-weight: 600; background: #ededf0; padding: 0.75rem 1.5rem; border-radius: 8px; border: 2px solid #667eea; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
        .back-link:hover { background: #667eea; color: white; }
        .calc-wrapper { display: flex; justify-content: center; width: 100%; }
        /* Override container max-width for full-screen calc */
        main.container { max-width: none; width: 100%; padding: 0 1rem; }
        /* Make the calculator fill available height */
        main.container .calc-wrapper { min-height: calc(100vh - 180px); }
        main.container .calc-wrapper > div { width: 100%; }
        /* Fullscreen button */
        .calc-fs-btn { position: fixed; bottom: 1rem; right: 1rem; z-index: 999; background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 1.2rem; cursor: pointer; transition: background 0.15s, color 0.15s; line-height: 1; }
        .calc-fs-btn:hover { background: rgba(0,0,0,0.85); color: #fff; border-color: rgba(255,255,255,0.5); }
        .calc-wrapper:fullscreen { background: #1a1a2e; padding: 1rem; overflow: auto; }
        .calc-wrapper:fullscreen .calc-fs-btn { position: absolute; }
    </style>
</head>
<body>
    <video id="video-background" autoplay loop muted playsinline>
        <source src="MainMenuLoop720p24fps.webm" type="video/webm">
    </video>
    <div id="video-overlay"></div>

    <header>
        <div class="container">
            <h1>⚔️ Melee Calculator</h1>
            <p>Knockback, hitstun, kill percents, shield safety — all in one place</p>
            <a href="index.html" class="back-link">← Back to Hub</a>
        </div>
    </header>

    <main class="container">
        <div class="calc-wrapper" id="calcWrapper">
            <div id="calculator-root"></div>
            <button class="calc-fs-btn" onclick="toggleCalcFullscreen()" title="Toggle fullscreen">⛶</button>
        </div>
    </main>

    <script>
        function toggleCalcFullscreen() {
            const el = document.getElementById('calcWrapper');
            if (!document.fullscreenElement) el.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        }
        window.onerror = function(msg, src, line, col, err) {
            var d = document.createElement('pre');
            d.style.cssText = 'color:red;padding:1rem;white-space:pre-wrap;background:#111;margin:0;font-size:12px';
            d.textContent = 'ERROR: ' + msg + '\nSource: ' + src + ':' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '');
            document.body.appendChild(d);
        };
        window.addEventListener('unhandledrejection', function(e) {
            var d = document.createElement('pre');
            d.style.cssText = 'color:orange;padding:1rem;white-space:pre-wrap;background:#111;margin:0;font-size:12px';
            d.textContent = 'UNHANDLED REJECTION: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
            document.body.appendChild(d);
        });
    </script>
    <script type="module">
        import { embedCalculator } from './ikneedata-ui.js';
        try {
            embedCalculator('calculator-root');
        } catch(e) {
            var el = document.getElementById('calculator-root');
            if (el) el.innerHTML = '<pre style="color:red;padding:1rem;white-space:pre-wrap;">INIT ERROR: ' + e.message + '\n' + e.stack + '</pre>';
        }
    </script>
</body>
</html>
